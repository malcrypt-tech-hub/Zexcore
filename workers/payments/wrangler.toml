name = "zexcore-payments"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true

[vars]
FIREBASE_PROJECT_ID = "zexcore-5d6c0"
APP_URL = "https://zexcore.com.ng"
ALLOWED_ORIGINS = "https://zexcore.com.ng,https://www.zexcore.com.ng,https://zexcore-5d6c0.web.app,https://zexcore-5d6c0.firebaseapp.com"
NGN_PER_USD = "auto"

# Secrets (set in the Cloudflare dashboard, never in this file):
#   PAYSTACK_SECRET_KEY        Paystack secret key. Money routes only work with sk_live_...; an sk_test_ key needs ALLOW_TEST_PAYMENTS="true" (staging only).
#   FIREBASE_SERVICE_ACCOUNT   service-account JSON with the "Cloud Datastore User" role only

# Optional secrets: RESEND_API_KEY and MAIL_FROM turn on e-mail alerts to the workspace owner.

# Optional: rate limit the public (signed-out) routes per visitor. Uncomment after enabling Rate Limiting for your account,
# then redeploy. Without it the Worker still works; add a Cloudflare dashboard rate-limit rule instead.
# [[unsafe.bindings]]
# name = "PUBLIC_RL"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 30, period = 60 }
